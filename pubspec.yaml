name: llama_village
description: "A 3D living village of AI llamas (generative agents) that you watch and visit as Dash."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_scene: 0.23.0
  flutter_soloud: 4.1.7
  hooks: ^2.0.0
  intl: any
  llamadart: ^0.9.0
  path_provider: ^2.1.5
  shared_preferences: 2.5.5
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - flutter_scene_generated/
    - assets/audio/
    - assets/portraits/
  fonts:
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/gowundodum/GowunDodum-Regular.ttf
    - family: Jua
      fonts:
        - asset: assets/fonts/jua/Jua-Regular.ttf
    - family: GowunBatang
      fonts:
        - asset: assets/fonts/gowunbatang/GowunBatang-Regular.ttf
        - asset: assets/fonts/gowunbatang/GowunBatang-Bold.ttf
          weight: 700

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
